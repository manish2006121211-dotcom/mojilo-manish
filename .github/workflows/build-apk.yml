name: Build Mojilo Manish APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          rm -rf app
          mkdir app
          unzip -o mojilo-manish.zip -d app
          echo "Project extracted:"
          ls -la app

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install project dependencies
        working-directory: app
        run: npm install

      - name: Install Firebase
        working-directory: app
        run: npm install firebase

      - name: Install Capacitor
        working-directory: app
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Fix Firebase config path
        working-directory: app
        run: |
          sed -i 's#\.\./firebase-applet-config\.json#../../firebase-applet-config.json#g' src/lib/firebase.ts
          echo "Firebase import fixed:"
          grep -n "firebase-applet-config" src/lib/firebase.ts

      - name: Build web app
        working-directory: app
        run: npm run build

      - name: Add Android platform
        working-directory: app
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: app
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build Debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mojilo-manish-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
