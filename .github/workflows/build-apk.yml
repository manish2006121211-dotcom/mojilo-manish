name: Build Mojilo Manish APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Extract project ZIP
      - name: Extract project ZIP
        run: |
          mkdir -p project

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP found: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d project
          else
            echo "No ZIP found. Using repository files."
            cp -r . project/
          fi

      # 3. Find actual web project
      - name: Fix project folder
        run: |
          cd project

          if [ -f package.json ]; then
            echo "package.json found."
          else
            FOUND=$(find . -name package.json -type f | head -n 1)

            if [ -n "$FOUND" ]; then
              DIR=$(dirname "$FOUND")

              echo "Project found in: $DIR"

              cp -r "$DIR"/* .
              cp -r "$DIR"/.[!.]* . 2>/dev/null || true
            else
              echo "ERROR: package.json not found."
              exit 1
            fi
          fi

          echo "Project ready."

      # 4. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 5. Check Node
      - name: Check Node and npm
        run: |
          node --version
          npm --version

      # 6. Install project dependencies
      - name: Install project dependencies
        working-directory: project
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # 7. Install Firebase
      - name: Install Firebase
        working-directory: project
        run: |
          npm install firebase

      # 8. Install Capacitor
      - name: Install Capacitor
        working-directory: project
        run: |
          npm install @capacitor/core @capacitor/cli
          npm install @capacitor/android

      # 9. Firebase configuration
      - name: Create Firebase configuration
        working-directory: project
        run: |
          cat > firebase-applet-config.json <<'EOF'
          {
            "apiKey": "",
            "authDomain": "",
            "projectId": "",
            "storageBucket": "",
            "messagingSenderId": "",
            "appId": ""
          }
          EOF

          echo "Firebase configuration created."

      # 10. Install Pillow
      - name: Install Pillow
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install Pillow

      # 11. Create required app images
      - name: Create required app images
        run: |
          mkdir -p project/src/assets/images

          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import os

          size = 1024

          img = Image.new(
              "RGB",
              (size, size),
              "#2563EB"
          )

          draw = ImageDraw.Draw(img)

          margin = 100

          draw.rounded_rectangle(
              (
                  margin,
                  margin,
                  size - margin,
                  size - margin
              ),
              radius=180,
              fill="white"
          )

          font_paths = [
              "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
              "/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf"
          ]

          font = None

          for path in font_paths:
              if os.path.exists(path):
                  font = ImageFont.truetype(path, 400)
                  break

          if font is None:
              font = ImageFont.load_default()

          text = "M"

          bbox = draw.textbbox(
              (0, 0),
              text,
              font=font
          )

          text_width = bbox[2] - bbox[0]
          text_height = bbox[3] - bbox[1]

          x = (size - text_width) // 2
          y = (size - text_height) // 2 - 30

          draw.text(
              (x, y),
              text,
              fill="#2563EB",
              font=font
          )

          img.save(
              "project/src/assets/images/icon.png",
              "PNG"
          )

          img.save(
              "project/src/assets/images/app_icon_1786271094033.jpg",
              "JPEG",
              quality=95
          )

          print("App images created.")
          PY

          ls -lh project/src/assets/images/

      # 12. Verify image
      - name: Verify required image
        working-directory: project
        run: |
          test -f src/assets/images/app_icon_1786271094033.jpg
          echo "Required JPG image found."

      # 13. Build web app
      - name: Build web app
        working-directory: project
        run: |
          npm run build

      # 14. Add Android platform
      - name: Add Android platform
        working-directory: project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "Android platform already exists."
          fi

      # 15. Sync Capacitor
      - name: Sync Capacitor
        working-directory: project
        run: |
          npx cap sync android

      # 16. Install Android SDK 35
      - name: Setup Android SDK 35
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 17. Set Android SDK 35
      - name: Set Android compile SDK 35
        working-directory: project/android
        run: |
          echo "Updating Android SDK to 35..."

          find . -name "*.gradle" -type f -exec sed -i \
            -e 's/compileSdkVersion[[:space:]]*=[[:space:]]*34/compileSdkVersion = 35/g' \
            -e 's/compileSdkVersion[[:space:]]*34/compileSdkVersion 35/g' \
            -e 's/targetSdkVersion[[:space:]]*=[[:space:]]*34/targetSdkVersion = 35/g' \
            -e 's/targetSdkVersion[[:space:]]*34/targetSdkVersion 35/g' \
            {} +

          echo "Android SDK 35 configured."

      # 18. Fix Kotlin duplicate classes
      - name: Fix Kotlin duplicate dependencies
        working-directory: project/android
        run: |
          cat >> build.gradle <<'EOF'

          allprojects {
              configurations.all {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == "org.jetbrains.kotlin") {
                          details.useVersion "1.8.22"
                      }
                  }

                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
              }
          }
          EOF

          echo "Kotlin duplicate dependencies fixed."

      # 19. Setup Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 20. Check Java
      - name: Check Java version
        run: |
          java -version
          javac -version

      # 21. Make Gradle executable
      - name: Make Gradle executable
        working-directory: project/android
        run: |
          chmod +x gradlew

      # 22. Clean Gradle
      - name: Clean Gradle
        working-directory: project/android
        run: |
          ./gradlew clean --no-daemon

      # 23. Build Debug APK
      - name: Build Debug APK
        working-directory: project/android
        run: |
          ./gradlew assembleDebug --no-daemon

      # 24. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mojilo-Manish-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk

      # 25. Show APK
      - name: Show APK
        run: |
          echo "======================================"
          echo "MOJILO MANISH APK BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh project/android/app/build/outputs/apk/debug/app-debug.apk
