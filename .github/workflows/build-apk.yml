name: Build Mojilo Manish APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Find and Extract ZIP
      # ==========================================
      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for ZIP file..."

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found!"
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"

          rm -rf app
          mkdir -p app

          unzip -q "$ZIP_FILE" -d app

          echo "Extracted files:"
          find app -maxdepth 3 -type f | head -100


      # ==========================================
      # 3. Fix nested ZIP folder
      # ==========================================
      - name: Fix project folder
        shell: bash
        run: |
          set -e

          if [ ! -f app/package.json ]; then

            PROJECT_DIR=$(find app -name package.json -type f | head -n 1)

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: package.json not found!"
              exit 1
            fi

            PROJECT_DIR=$(dirname "$PROJECT_DIR")

            echo "Project found at: $PROJECT_DIR"

            mkdir -p app_temp

            cp -r "$PROJECT_DIR"/. app_temp/

            rm -rf app

            mv app_temp app
          fi

          echo "Final project:"
          ls -la app


      # ==========================================
      # 4. Setup Node.js
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # ==========================================
      # 5. Install dependencies
      # ==========================================
      - name: Install project dependencies
        working-directory: app
        shell: bash
        run: |
          set -e

          echo "Installing dependencies..."

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi


      # ==========================================
      # 6. Install Firebase
      # ==========================================
      - name: Install Firebase
        working-directory: app
        shell: bash
        run: |
          npm install firebase


      # ==========================================
      # 7. Install Capacitor
      # ==========================================
      - name: Install Capacitor
        working-directory: app
        shell: bash
        run: |
          npm install @capacitor/core
          npm install @capacitor/cli
          npm install @capacitor/android


      # ==========================================
      # 8. Create Firebase configuration
      # ==========================================
      - name: Create Firebase configuration
        working-directory: app
        shell: bash
        run: |
          mkdir -p src/lib

          cat > src/lib/firebase.ts <<'EOF'
          import { initializeApp } from "firebase/app";

          const firebaseConfig = {
            apiKey: import.meta.env.VITE_FIREBASE_API_KEY || "",
            authDomain: import.meta.env.VITE_FIREBASE_AUTH_DOMAIN || "",
            projectId: import.meta.env.VITE_FIREBASE_PROJECT_ID || "",
            storageBucket: import.meta.env.VITE_FIREBASE_STORAGE_BUCKET || "",
            messagingSenderId: import.meta.env.VITE_FIREBASE_MESSAGING_SENDER_ID || "",
            appId: import.meta.env.VITE_FIREBASE_APP_ID || ""
          };

          export const firebaseApp = initializeApp(firebaseConfig);
          EOF


      # ==========================================
      # 9. Create Firebase JSON
      # ==========================================
      - name: Create Firebase config JSON
        working-directory: app
        shell: bash
        run: |
          cat > firebase-applet-config.json <<'EOF'
          {
            "apiKey": "",
            "authDomain": "",
            "projectId": "",
            "storageBucket": "",
            "messagingSenderId": "",
            "appId": ""
          }
          EOF


      # ==========================================
      # 10. Fix Firebase import
      # ==========================================
      - name: Fix Firebase imports
        working-directory: app
        shell: bash
        run: |
          if [ -f src/lib/firebase.ts ]; then

            sed -i \
            's#firebase-applet-config.json#../../firebase-applet-config.json#g' \
            src/lib/firebase.ts || true

          fi


      # ==========================================
      # 11. Create App Icon
      # ==========================================
      - name: Create missing app icon
        working-directory: app
        shell: bash
        run: |

          mkdir -p src/assets/images

          cat > src/assets/images/app_icon.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg"
               width="512"
               height="512"
               viewBox="0 0 512 512">

            <rect
              width="512"
              height="512"
              rx="110"
              fill="#1976D2"/>

            <circle
              cx="256"
              cy="205"
              r="110"
              fill="white"/>

            <text
              x="256"
              y="235"
              text-anchor="middle"
              font-family="Arial"
              font-size="72"
              font-weight="bold"
              fill="#1976D2">
              MM
            </text>

            <text
              x="256"
              y="380"
              text-anchor="middle"
              font-family="Arial"
              font-size="40"
              font-weight="bold"
              fill="white">
              EXAM
            </text>

          </svg>
          EOF


      # ==========================================
      # 12. Fix Old Icon References
      # ==========================================
      - name: Fix app icon references
        working-directory: app
        shell: bash
        run: |

          find src \
          -type f \
          \( -name "*.tsx" -o -name "*.ts" -o -name "*.jsx" -o -name "*.js" \) \
          -print0 |

          while IFS= read -r -d '' file
          do

            sed -i \
            -E 's#images/app_icon_[^"]+\.(jpg|jpeg|png)#images/app_icon.svg#g' \
            "$file" || true

            sed -i \
            -E 's#\./images/app_icon_[^"]+\.(jpg|jpeg|png)#./images/app_icon.svg#g' \
            "$file" || true

          done


      # ==========================================
      # 13. Check package.json
      # ==========================================
      - name: Check web project
        working-directory: app
        shell: bash
        run: |

          if [ ! -f package.json ]; then
            echo "ERROR: package.json not found!"
            exit 1
          fi

          echo "package.json found."


      # ==========================================
      # 14. Build Web App
      # ==========================================
      - name: Build web app
        working-directory: app
        shell: bash
        run: |

          set -e

          echo "Building web application..."

          npm run build


      # ==========================================
      # 15. Add Android
      # ==========================================
      - name: Add Android platform
        working-directory: app
        shell: bash
        run: |

          if [ ! -d android ]; then
            npx cap add android
          else
            echo "Android platform already exists."
          fi


      # ==========================================
      # 16. Sync Capacitor
      # ==========================================
      - name: Sync Capacitor
        working-directory: app
        shell: bash
        run: |

          npx cap sync android


      # ==========================================
      # 17. Setup Java
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      # ==========================================
      # 18. Give Gradle permission
      # ==========================================
      - name: Make Gradle executable
        working-directory: app
        shell: bash
        run: |

          chmod +x android/gradlew


      # ==========================================
      # 19. Build APK
      # ==========================================
      - name: Build Debug APK
        working-directory: app
        shell: bash
        run: |

          cd android

          ./gradlew assembleDebug


      # ==========================================
      # 20. Upload APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mojilo-Manish-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk


      # ==========================================
      # 21. Confirm APK
      # ==========================================
      - name: Show APK
        working-directory: app
        shell: bash
        run: |

          echo ""
          echo "======================================"
          echo "       MOJILO MANISH APK"
          echo "======================================"
          echo ""

          ls -lh android/app/build/outputs/apk/debug/

          echo ""
          echo "APK BUILD COMPLETED!"
          echo ""
