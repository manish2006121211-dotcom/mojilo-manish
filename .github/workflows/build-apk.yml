name: Build Mojilo Manish APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Extract project ZIP
        run: |
          rm -rf app
          mkdir app
          unzip -o mojilo-manish.zip -d app

          echo "===== PROJECT FILES ====="
          find app -maxdepth 4 -type f | sort


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      - name: Install project dependencies
        working-directory: app
        run: |
          npm install


      - name: Install Firebase
        working-directory: app
        run: |
          npm install firebase


      - name: Install Capacitor
        working-directory: app
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android


      - name: Create Firebase configuration
        working-directory: app
        run: |
          cat > firebase-applet-config.json <<'EOF'
          {
            "apiKey": "AIzaSyDummyBuildKey",
            "authDomain": "mojilo-manish.firebaseapp.com",
            "projectId": "mojilo-manish",
            "storageBucket": "mojilo-manish.firebasestorage.app",
            "messagingSenderId": "000000000000",
            "appId": "1:000000000000:web:0000000000000000000000",
            "firestoreDatabaseId": "(default)"
          }
          EOF

          echo "Firebase configuration created."


      - name: Create missing app icon
        run: |
          mkdir -p app/src/assets/images

          python3 - <<'PY'
          from PIL import Image, ImageDraw

          img = Image.new("RGB", (512, 512), "white")
          draw = ImageDraw.Draw(img)

          draw.rounded_rectangle(
              (20, 20, 492, 492),
              radius=90,
              fill="#2196F3"
          )

          draw.text(
              (120, 205),
              "MM",
              fill="white"
          )

          img.save(
              "app/src/assets/images/app_icon_1786271094033.jpg",
              quality=95
          )

          print("App icon created successfully.")
          PY


      - name: Fix Firebase import
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          file = Path("src/lib/firebase.ts")

          if file.exists():
              text = file.read_text()

              text = re.sub(
                  r'["\'](?:\.\./)+firebase-applet-config\.json["\']',
                  '"../../firebase-applet-config.json"',
                  text
              )

              file.write_text(text)

          print("Firebase import checked.")
          PY


      - name: Build web app
        working-directory: app
        run: |
          npm run build


      - name: Add Android platform
        working-directory: app
        run: |
          npx cap add android


      - name: Sync Capacitor
        working-directory: app
        run: |
          npx cap sync android


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21


      - name: Build Debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mojilo-Manish-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
