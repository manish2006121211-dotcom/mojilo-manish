name: Build Mojilo Manish APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          rm -rf app
          mkdir -p app
          unzip -o mojilo-manish.zip -d app

      - name: Fix project folder
        run: |
          if [ -d "app/app" ]; then
            cp -a app/app/. app/
            rm -rf app/app
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        working-directory: app
        run: |
          npm install

      - name: Install Firebase
        working-directory: app
        run: |
          npm install firebase

      - name: Install Capacitor
        working-directory: app
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Firebase configuration
        working-directory: app
        run: |
          cat > firebase-applet-config.json <<'EOF'
          {
            "apiKey": "${{ secrets.FIREBASE_API_KEY }}",
            "authDomain": "${{ secrets.FIREBASE_AUTH_DOMAIN }}",
            "projectId": "${{ secrets.FIREBASE_PROJECT_ID }}",
            "storageBucket": "${{ secrets.FIREBASE_STORAGE_BUCKET }}",
            "messagingSenderId": "${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}",
            "appId": "${{ secrets.FIREBASE_APP_ID }}"
          }
          EOF

      - name: Fix Firebase import
        working-directory: app
        run: |
          if [ -f "src/lib/firebase.ts" ]; then
            sed -i 's#"\.\./\.\./firebase-applet-config\.json"#"../../firebase-applet-config.json"#g' src/lib/firebase.ts
            sed -i "s#'../../firebase-applet-config.json'#'../../firebase-applet-config.json'#g" src/lib/firebase.ts
          fi

      - name: Create app icon
        working-directory: app
        run: |
          mkdir -p src/assets/images
          python3 - <<'PY'
          import os
          from PIL import Image, ImageDraw

          path = "src/assets/images/app_icon.png"

          img = Image.new("RGBA", (512, 512), (30, 100, 220, 255))
          draw = ImageDraw.Draw(img)

          draw.rounded_rectangle(
              (40, 40, 472, 472),
              radius=90,
              fill=(30, 100, 220, 255)
          )

          draw.text(
              (130, 180),
              "M",
              fill="white"
          )

          img.save(path)
          print("App icon created:", path)
          PY

      - name: Check web project
        working-directory: app
        run: |
          test -f package.json
          test -f index.html
          test -d src
          echo "Web project OK"

      - name: Fix app icon references
        working-directory: app
        run: |
          find src -type f \( -name "*.ts" -o -name "*.tsx" -o -name "*.js" -o -name "*.jsx" -o -name "*.css" \) -print0 |
          xargs -0 sed -i 's#\./images/app_icon_[^"]*\.jpg#./images/app_icon.png#g' || true

      - name: Build web app
        working-directory: app
        run: |
          npm run build

      - name: Add Android platform
        working-directory: app
        run: |
          npx cap add android

      - name: Sync Capacitor
        working-directory: app
        run: |
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make Gradle executable
        working-directory: app
        run: |
          chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: app
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mojilo-Manish-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Show APK
        run: |
          ls -lh app/android/app/build/outputs/apk/debug/app-debug.apk
