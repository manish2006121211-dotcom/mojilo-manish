name: Build Mojilo Manish APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          rm -rf app
          mkdir app
          unzip -o mojilo-manish.zip -d app

          echo "===== Extracted files ====="
          find app -maxdepth 3 -type f | sort

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install project dependencies
        working-directory: app
        run: npm install

      - name: Install Firebase
        working-directory: app
        run: npm install firebase

      - name: Install Capacitor
        working-directory: app
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Locate Firebase config
        run: |
          echo "Searching for Firebase config..."
          find app -type f -name "firebase-applet-config.json" -print

          CONFIG=$(find app -type f -name "firebase-applet-config.json" | head -n 1)

          if [ -z "$CONFIG" ]; then
            echo "Firebase config file not found."
            exit 1
          fi

          echo "Found: $CONFIG"

          if [ "$CONFIG" != "app/firebase-applet-config.json" ]; then
            cp "$CONFIG" app/firebase-applet-config.json
          fi

          test -f app/firebase-applet-config.json
          echo "Firebase config is ready."

      - name: Fix Firebase import
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          file = Path("src/lib/firebase.ts")
          text = file.read_text()

          text = re.sub(
              r'(?:\.\./)+firebase-applet-config\.json',
              '../../firebase-applet-config.json',
              text
          )

          file.write_text(text)

          print("===== Firebase import =====")
          for line in text.splitlines():
              if "firebase-applet-config" in line:
                  print(line)
          PY

      - name: Build web app
        working-directory: app
        run: npm run build

      - name: Add Android platform
        working-directory: app
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: app
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build Debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mojilo-manish-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
